# Web UI এর nginx কনফিগ।
#
#   http://localhost:3000/          -> public/ ফোল্ডারের HTML/CSS/JS (static ফাইল)
#   http://localhost:3000/api/...   -> backend এর FastAPI (http://api:8000/...) তে ফরোয়ার্ড
#
# একে বলে "reverse proxy"। ব্রাউজার শুধু localhost:3000 চেনে, backend কোথায় আছে জানতে হয় না।
# আর UI ও API একই origin (localhost:3000) এ থাকায় CORS এর ঝামেলাও নেই।

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # বড় PDF আপলোডের জন্য (nginx এর ডিফল্ট সীমা মাত্র 1MB)
    client_max_body_size 200m;

    # Docker এর ভেতরের DNS সার্ভার। api container রিস্টার্ট হয়ে নতুন IP পেলেও
    # nginx প্রতি 10 সেকেন্ডে নতুন করে খুঁজে নেবে (নাহলে পুরনো IP তে আটকে 502 দিত)।
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /api/ {
        set $backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;   # /api/ask/stream -> /ask/stream
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # streaming উত্তর (Server-Sent Events) যেন nginx জমিয়ে না রেখে সাথে সাথে ব্রাউজারে পাঠায়
        proxy_buffering off;
        proxy_cache off;

        # ingestion বড় হলে কয়েক মিনিট চলতে পারে
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        # কোড বদলালে ব্রাউজার যেন পুরনো app.js/styles.css cache থেকে না দেখায়
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
