<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RAG Learning</title>
  <meta name="description" content="নিজের ডকুমেন্ট নিয়ে প্রশ্ন করো — RAG + Gemini">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b5bd6'/%3E%3Cstop offset='1' stop-color='%239b5de5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // পেজ আঁকার আগেই সেভ করা theme বসাই, যাতে সাদা থেকে কালোতে "ঝলক" না দেখা যায়
    try {
      const t = localStorage.getItem("rag.theme");
      if (t) document.documentElement.dataset.theme = JSON.parse(t);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Icon sprite: একবার সংজ্ঞা, তারপর <use href="#i-নাম"> দিয়ে যেকোনো জায়গায় ব্যবহার -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0l1.58 6.14a2 2 0 0 0 1.44 1.44l6.14 1.58a.5.5 0 0 1 0 .96l-6.14 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3 8 21"/><path d="m16 3-2 18"/></symbol>
  </svg>

  <div class="app">
    <!-- ============================== Sidebar: Knowledge base ============================== -->
    <aside class="sidebar" id="sidebar" aria-label="Knowledge base">
      <div class="sidebar-head">
        <div class="brand">
          <div class="brand-logo"><svg class="icon"><use href="#i-sparkles"/></svg></div>
          <div>
            <div class="brand-name">RAG Learning</div>
            <div class="brand-sub">তোমার ডকুমেন্ট + Gemini</div>
          </div>
        </div>
        <button class="icon-btn only-mobile" id="closeSidebar" aria-label="Sidebar বন্ধ করো">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>

      <button class="btn btn-primary btn-block" id="newChat">
        <svg class="icon"><use href="#i-plus"/></svg>নতুন চ্যাট
      </button>

      <section class="panel">
        <h2 class="panel-title"><svg class="icon"><use href="#i-database"/></svg>Knowledge base</h2>
        <div class="stats">
          <div class="stat"><span class="stat-value" id="statFiles">–</span><span class="stat-label">ফাইল</span></div>
          <div class="stat"><span class="stat-value" id="statChunks">–</span><span class="stat-label">চাঙ্ক (Vector DB)</span></div>
        </div>
        <ul class="file-list" id="fileList"></ul>

        <label class="dropzone" id="dropzone">
          <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md,.docx" hidden>
          <span class="dropzone-icon"><svg class="icon"><use href="#i-upload"/></svg></span>
          <span class="dropzone-text">ফাইল এখানে ছেড়ে দাও বা <u>ব্রাউজ করো</u></span>
          <small>PDF · TXT · MD · DOCX</small>
        </label>

        <button class="btn btn-secondary btn-block" id="ingestBtn" title="docs/ এর সব ফাইল থেকে Vector DB নতুন করে বানাও">
          <svg class="icon"><use href="#i-refresh"/></svg><span>Rebuild index</span>
        </button>
      </section>

      <section class="panel">
        <h2 class="panel-title">Settings</h2>
        <div class="field">
          <label for="topk">Top-K <span class="field-hint">কয়টা চাঙ্ক retrieve হবে</span></label>
          <div class="range-row">
            <input type="range" id="topk" min="1" max="10" step="1" value="4">
            <output id="topkValue" for="topk">4</output>
          </div>
        </div>
        <label class="switch-row">
          <span>LLM prompt দেখাও</span>
          <input type="checkbox" id="showPrompt">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <div class="sidebar-foot">
        <div class="model-info" id="modelInfo"></div>
        <button class="icon-btn" id="themeToggle" aria-label="Theme বদলাও"></button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ============================== Main: Chat ============================== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" aria-label="Sidebar খোলো">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <div class="mode-switch" role="tablist" aria-label="Mode">
          <button type="button" role="tab" data-mode="chat"><svg class="icon"><use href="#i-message"/></svg>Chat</button>
          <button type="button" role="tab" data-mode="search"><svg class="icon"><use href="#i-search"/></svg>শুধু Search</button>
        </div>
        <div class="status" id="status"><span class="dot"></span><span class="status-text">Connecting…</span></div>
      </header>

      <div class="chat" id="chat">
        <div class="chat-inner" id="messages" aria-live="polite"></div>
      </div>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="তোমার ডকুমেন্ট নিয়ে প্রশ্ন করো…" aria-label="প্রশ্ন"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="পাঠাও" disabled>
            <svg class="icon"><use href="#i-arrow-up"/></svg>
          </button>
        </form>
        <p class="composer-hint" id="composerHint">Enter = পাঠাও · Shift + Enter = নতুন লাইন · উত্তর আসে শুধু তোমার ডকুমেন্ট থেকে</p>
      </footer>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
